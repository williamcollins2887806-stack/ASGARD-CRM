<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <title>MB harness</title>
  <link rel="stylesheet" href="/assets/css/design-tokens.css"/>
  <link rel="stylesheet" href="/assets/css/app.css"/>
  <link rel="stylesheet" href="/assets/css/cr-modal.css"/>
  <link rel="stylesheet" href="/assets/css/light-theme.css"/>
  <style>
    body { margin:0; background: var(--bg1); font-family: var(--ff); }
    /* Компактная копия реального оверлея: те же классы, что в AsgardUI.showModal */
    .cr-m-overlay { position: fixed; inset: 0; display:flex; align-items:flex-start; justify-content:center;
      padding: 40px 20px; background: rgba(0,0,0,.65); overflow-y:auto; z-index: 10000; }
    .cr-m-overlay--visible { opacity: 1; }
  </style>
</head>
<body>
<div id="stage"></div>
<script>
/* ── Минимальный стенд: ровно те API, которые использует morning_brief.js ── */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let overlayEl = null;
window.AsgardUI = {
  esc,
  toast: (t, m) => console.log('toast', t, m),
  showModal({ title, subtitle, icon, html, wide, onMount }) {
    const ov = document.createElement('div');
    ov.className = 'cr-m-overlay cr-m-overlay--visible';
    ov.innerHTML = `
      <div class="cr-m ${wide ? 'cr-m--wide' : ''}">
        <div class="cr-m__topline"></div>
        <div class="cr-m__header">
          <div class="cr-m__icon">${esc(icon || '')}</div>
          <div class="cr-m__titles">
            <div class="cr-m__title">${esc(title)}</div>
            <div class="cr-m__subtitle">${esc(subtitle || '')}</div>
          </div>
          <div class="cr-m__header-actions">
            <button class="cr-m__close">×</button>
          </div>
        </div>
        <div class="cr-m__body">${html}</div>
      </div>`;
    document.body.appendChild(ov);
    overlayEl = ov;
    if (onMount) onMount({ body: ov.querySelector('.cr-m__body'), modal: ov.querySelector('.cr-m'), back: ov });
    return ov;
  },
  hideModal() { if (overlayEl) overlayEl.remove(); overlayEl = null; }
};
window.AsgardMoney = {
  formatMoney: (v) => Number(v).toLocaleString('ru-RU') + ' ₽',
  formatMoneyShort: (v) => {
    const n = Number(v);
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' млн ₽';
    if (n >= 1e3) return Math.round(n / 1e3) + ' тыс ₽';
    return Math.round(n).toLocaleString('ru-RU') + ' ₽';
  }
};
window.AsgardAuth = { getAuth: async () => ({ token: 'x', user: { id: 1, role: 'ADMIN' } }) };

/* ── Пейлоад: значения взяты из реальной прод-выборки 19.10.2026 ── */

    ],

    ],
