<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#12161F" />
  <title>Разработка ASGARD CRM · статус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/roadmap.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="mark">AS</div>
        <div>
          <h1 id="title">Разработка и внедрение ASGARD CRM</h1>
          <p id="subtitle">План директора развития</p>
        </div>
      </div>
      <div class="top-right">
        <span class="live" id="live"><i class="dot"></i><span id="liveText">подключение…</span></span>
        <button class="icon-btn" id="themeBtn" title="Тема" aria-label="Переключить тему">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button class="icon-btn" id="refreshBtn" title="Обновить" aria-label="Обновить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Этапы"></nav>
    <div id="view"><div class="skeleton">Загрузка данных…</div></div>
  </div>

  <!-- Модалка подписи -->
  <div class="modal-bg" id="modalBg">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle">Подпись закрытия</h3>
      <div class="cp-title" id="mCpTitle"></div>

      <div class="field">
        <label>Кто закрывает</label>
        <div class="signers" id="mSigners"></div>
      </div>

      <div class="field">
        <label>PIN</label>
        <input class="pin-input" id="mPin" type="password" inputmode="numeric" autocomplete="off"
               maxlength="8" placeholder="••••" />
      </div>

      <div class="field">
        <label>Комментарий (необязательно)</label>
        <textarea id="mNote" maxlength="1000" placeholder="Например: прогнал тесты под ролью Олега Викторовича"></textarea>
        <div class="hint">Файл можно приложить к записи в блоке «Комментарии» на пункте.</div>
      </div>

      <div class="modal-err" id="mErr"></div>
      <div class="modal-actions">
        <button class="btn" id="mCancel">Отмена</button>
        <button class="btn btn-primary" id="mOk">Подтвердить</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
