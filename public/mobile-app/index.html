<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- D-267: interactive-widget=resizes-content — чтобы на Android клавиатура сжимала
       layout viewport, и нижние кнопки модалок не оставались под клавиатурой.
       На iOS не поддерживается — там работаем через visualViewport. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ASGARD" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <!-- Cinzel удалён: старый рунический шрифт больше не используется (редизайн 2026),
       а внешний <link> к Google Fonts блокировал рендер на ~12с в офлайне/сети РФ. -->
  <title>ASGARD CRM</title>
</head>
<body>
  <div id="root"></div>
  <!-- D-267: портал для модалок/шторок. Лежит ВНЕ #root, поэтому не наследует
       transform/filter от анимированных контейнеров роутов (иначе position: fixed
       внутри них уезжает за пределы экрана). -->
  <div id="modal-root"></div>
  <!-- Единый формат телефона по всей СРМ (в т.ч. мобильная): +7 (916) 061-48-09.
       Файл копируется из public/assets/js/phone_mask.js шагом prebuild
       (tools/sync-phone-mask.mjs) — единый источник истины. -->
  <script src="/phone_mask.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
