  <line x1="160" y1="200" x2="160" y2="320"/>
  <line x1="200" y1="200" x2="200" y2="320"/>
  <line x1="240" y1="200" x2="240" y2="320"/>
  <line x1="280" y1="200" x2="280" y2="320"/>
