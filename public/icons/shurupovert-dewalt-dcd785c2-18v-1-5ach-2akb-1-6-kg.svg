  <rect x="120" y="160" width="240" height="120" rx="20"/>
  <rect x="360" y="190" width="60" height="60" rx="8"/>
  <rect x="200" y="280" width="100" height="120" rx="14"/>
  <rect x="170" y="400" width="160" height="48" rx="10"/>
</g>
<g class="accent w7">
  <line x1="380" y1="220" x2="440" y2="220"/>
</g>
<g class="ink w4">
  <line x1="220" y1="320" x2="280" y2="320"/>
  <line x1="220" y1="350" x2="280" y2="350"/>
</g>
</svg>
