<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="120" y="160" width="220" height="170" rx="16"/>
  <rect x="180" y="120" width="100" height="40" rx="8"/>
  <line x1="120" y1="240" x2="80" y2="240"/>
  <line x1="80" y1="220" x2="80" y2="260"/>
  <line x1="340" y1="240" x2="380" y2="240"/>
  <rect x="380" y="220" width="40" height="40" rx="4"/>
  <rect x="100" y="360" width="260" height="30" rx="6"/>
  <line x1="130" y1="390" x2="130" y2="430"/>
  <line x1="330" y1="390" x2="330" y2="430"/>
  <rect x="100" y="430" width="260" height="30" rx="6"/>
</g>
<g class="accent w7">
  <line x1="160" y1="180" x2="160" y2="320"/>
  <line x1="200" y1="180" x2="200" y2="320"/>
  <line x1="240" y1="180" x2="240" y2="320"/>
  <line x1="280" y1="180" x2="280" y2="320"/>
  <line x1="320" y1="180" x2="320" y2="320"/>
</g>
</svg>
