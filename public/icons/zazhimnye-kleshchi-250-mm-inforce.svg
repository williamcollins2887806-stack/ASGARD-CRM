<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <line x1="80" y1="180" x2="380" y2="320"/>
  <line x1="80" y1="320" x2="380" y2="180"/>
  <polyline points="380,180 432,180 432,200"/>
  <polyline points="380,320 432,320 432,300"/>
  <polyline points="80,180 60,170 60,330 80,320"/>
</g>
<g class="ink w4">
  <line x1="388" y1="190" x2="424" y2="190"/>
  <line x1="388" y1="210" x2="424" y2="210"/>
  <line x1="388" y1="290" x2="424" y2="290"/>
  <line x1="388" y1="310" x2="424" y2="310"/>
</g>
<g class="accent w6">
  <line x1="160" y1="380" x2="220" y2="380"/>
  <line x1="190" y1="350" x2="190" y2="410"/>
</g>
<g class="accent-fill">
