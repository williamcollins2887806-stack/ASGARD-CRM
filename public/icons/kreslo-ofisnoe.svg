<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="160" y="72" width="160" height="200" rx="20"/>
  <rect x="120" y="272" width="240" height="48" rx="12"/>
  <line x1="240" y1="320" x2="240" y2="400"/>
  <line x1="160" y1="430" x2="320" y2="430"/>
  <line x1="240" y1="400" x2="160" y2="430"/>
  <line x1="240" y1="400" x2="320" y2="430"/>
  <line x1="240" y1="400" x2="200" y2="445"/>
  <line x1="240" y1="400" x2="280" y2="445"/>
</g>
<g class="ink-fill">
  <circle cx="160" cy="438" r="10"/>
  <circle cx="320" cy="438" r="10"/>
  <circle cx="200" cy="450" r="10"/>
  <circle cx="280" cy="450" r="10"/>
</g>
<g class="accent w7">
  <line x1="190" y1="180" x2="290" y2="180"/>
</g>
</svg>
