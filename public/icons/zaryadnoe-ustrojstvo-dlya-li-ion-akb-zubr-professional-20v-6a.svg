<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="120" y="240" width="270" height="160" rx="12"/>
  <rect x="180" y="160" width="150" height="80" rx="8"/>
  <rect x="210" y="130" width="90" height="30" rx="4"/>
</g>
<g class="accent-fill">
  <rect x="150" y="280" width="160" height="40" rx="4"/>
  <circle cx="350" cy="300" r="10"/>
</g>
<g class="ink w7">
  <line x1="390" y1="320" x2="430" y2="320"/>
  <line x1="430" y1="320" x2="430" y2="380"/>
</g>
<g class="ink w4">
  <line x1="150" y1="360" x2="360" y2="360"/>
</g>
</svg>
