</style>
<g class="ink w12">
  <line x1="170" y1="70" x2="170" y2="450"/>
  <line x1="342" y1="70" x2="342" y2="450"/>
</g>
<g class="ink w10">
  <line x1="170" y1="120" x2="342" y2="120"/>
  <line x1="170" y1="180" x2="342" y2="180"/>
  <line x1="170" y1="240" x2="342" y2="240"/>
  <line x1="170" y1="300" x2="342" y2="300"/>
  <line x1="170" y1="360" x2="342" y2="360"/>
  <line x1="170" y1="420" x2="342" y2="420"/>
</g>
</svg>
