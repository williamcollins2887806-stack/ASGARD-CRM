<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <polygon points="60,300 220,260 420,260 440,300 420,340 220,340 60,340"/>
  <line x1="220" y1="260" x2="220" y2="340"/>
</g>
<g class="ink w7">
  <line x1="250" y1="290" x2="400" y2="290"/>
  <line x1="250" y1="310" x2="400" y2="310"/>
</g>
<g class="accent w6">
  <circle cx="100" cy="300" r="10"/>
</g>
</svg>
