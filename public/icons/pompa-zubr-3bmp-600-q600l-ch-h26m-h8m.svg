  <rect x="160" y="380" width="200" height="40" rx="6"/>
  <line x1="200" y1="120" x2="200" y2="80"/>
  <line x1="170" y1="80" x2="230" y2="80"/>
</g>
<g class="accent w7">
  <line x1="200" y1="256" x2="260" y2="216"/>
  <line x1="200" y1="256" x2="140" y2="216"/>
  <line x1="200" y1="256" x2="260" y2="296"/>
