  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <path d="M 60 200 C 140 120, 240 280, 320 200 S 460 200, 460 200"/>
  <path d="M 60 280 C 140 200, 240 360, 320 280 S 460 280, 460 280"/>
</g>
<g class="accent w6">
  <path d="M 60 200 C 140 120, 240 280, 320 200 S 460 200, 460 200"/>
  <path d="M 60 280 C 140 200, 240 360, 320 280 S 460 280, 460 280"/>
</g>
<g class="ink w7">
  <rect x="60" y="180" width="40" height="120" rx="6"/>
  <rect x="420" y="180" width="40" height="120" rx="6"/>
</g>
</svg>
