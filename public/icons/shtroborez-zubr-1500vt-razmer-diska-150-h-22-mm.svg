  <circle cx="380" cy="260" r="20"/>
</g>
<g class="ink w4">
  <line x1="140" y1="200" x2="200" y2="200"/>
  <line x1="140" y1="220" x2="200" y2="220"/>
  <line x1="140" y1="240" x2="200" y2="240"/>
