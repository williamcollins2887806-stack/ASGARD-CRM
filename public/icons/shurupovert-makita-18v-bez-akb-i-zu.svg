  <rect x="120" y="160" width="230" height="130" rx="22"/>
  <rect x="350" y="190" width="70" height="70" rx="10"/>
  <rect x="200" y="290" width="100" height="120" rx="14"/>
</g>
<g class="accent w7">
  <line x1="370" y1="225" x2="430" y2="225"/>
</g>
<g class="ink w4">
  <line x1="220" y1="330" x2="280" y2="330"/>
</g>
</svg>
