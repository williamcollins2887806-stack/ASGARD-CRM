<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <circle cx="220" cy="280" r="110"/>
  <rect x="280" y="80" width="80" height="120" rx="10"/>
  <rect x="290" y="200" width="60" height="40" rx="6"/>
  <rect x="120" y="390" width="240" height="40" rx="6"/>
  <line x1="320" y1="60" x2="320" y2="80"/>
</g>
<g class="accent w9">
  <line x1="220" y1="280" x2="220" y2="170"/>
  <line x1="220" y1="170" x2="280" y2="170"/>
</g>
<g class="accent w7">
  <line x1="220" y1="280" x2="270" y2="240"/>
  <line x1="220" y1="280" x2="170" y2="240"/>
  <line x1="220" y1="280" x2="270" y2="320"/>
  <line x1="220" y1="280" x2="170" y2="320"/>
</g>
<g class="ink-fill">
  <circle cx="220" cy="280" r="14"/>
</g>
</svg>
