  <circle cx="120" cy="160" r="12"/>
  <circle cx="256" cy="160" r="12"/>
  <circle cx="392" cy="160" r="12"/>
  <circle cx="120" cy="304" r="12"/>
  <circle cx="256" cy="304" r="12"/>
  <circle cx="392" cy="304" r="12"/>
  <circle cx="120" cy="424" r="12"/>
