  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="100" y="200" width="100" height="112" rx="6"/>
  <rect x="200" y="220" width="120" height="72" rx="8"/>
  <rect x="320" y="180" width="100" height="152" rx="6"/>
</g>
<g class="accent-fill">
  <rect x="130" y="232" width="40" height="48"/>
  <rect x="346" y="220" width="48" height="72"/>
</g>
<g class="ink w4">
  <line x1="200" y1="240" x2="200" y2="272"/>
  <line x1="320" y1="220" x2="320" y2="292"/>
</g>
</svg>
