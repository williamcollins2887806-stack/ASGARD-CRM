<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <ellipse cx="320" cy="220" rx="70" ry="60"/>
  <rect x="80" y="240" width="120" height="60" rx="14"/>
  <line x1="200" y1="270" x2="250" y2="240"/>
  <line x1="320" y1="160" x2="320" y2="100"/>
  <line x1="290" y1="100" x2="350" y2="100"/>
  <rect x="240" y="320" width="200" height="100" rx="14"/>
  <rect x="270" y="290" width="140" height="30" rx="4"/>
</g>
<g class="accent w7">
  <line x1="120" y1="270" x2="180" y2="270"/>
</g>
<g class="accent-fill">
  <rect x="270" y="350" width="140" height="40" rx="4"/>
</g>
</svg>
