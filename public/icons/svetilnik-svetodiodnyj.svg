  <line x1="180" y1="120" x2="180" y2="150"/>
  <line x1="332" y1="120" x2="332" y2="150"/>
</g>
<g class="accent w7">
  <line x1="180" y1="320" x2="160" y2="400"/>
  <line x1="256" y1="320" x2="256" y2="410"/>
