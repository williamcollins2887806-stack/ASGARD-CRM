<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="120" y="160" width="240" height="100" rx="16"/>
  <rect x="200" y="260" width="80" height="120" rx="12"/>
  <rect x="180" y="380" width="120" height="60" rx="10"/>
  <line x1="360" y1="180" x2="420" y2="180"/>
  <line x1="360" y1="240" x2="420" y2="240"/>
  <line x1="420" y1="180" x2="420" y2="240"/>
  <circle cx="448" cy="210" r="20"/>
</g>
<g class="accent w7">
  <line x1="220" y1="400" x2="260" y2="400"/>
  <line x1="220" y1="420" x2="260" y2="420"/>
</g>
<g class="accent-fill">
  <rect x="140" y="180" width="40" height="40" rx="4"/>
</g>
</svg>
