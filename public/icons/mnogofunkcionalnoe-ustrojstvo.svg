<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="accent-fill">
  <rect x="160" y="100" width="192" height="60"/>
</g>
<g class="ink w10">
  <rect x="80" y="240" width="352" height="180" rx="12"/>
  <rect x="120" y="160" width="272" height="80" rx="8"/>
  <rect x="160" y="80" width="192" height="80" rx="6"/>
</g>
<g class="ink w7">
  <rect x="180" y="280" width="152" height="60" rx="4"/>
  <circle cx="380" cy="280" r="10"/>
  <circle cx="380" cy="320" r="10"/>
</g>
<g class="accent w5">
  <line x1="200" y1="300" x2="312" y2="300"/>
  <line x1="200" y1="320" x2="312" y2="320"/>
</g>
</svg>
