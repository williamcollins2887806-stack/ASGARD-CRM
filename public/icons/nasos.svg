<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <circle cx="240" cy="280" r="120"/>
  <rect x="220" y="80" width="80" height="100" rx="8"/>
  <line x1="360" y1="280" x2="430" y2="280"/>
  <line x1="430" y1="250" x2="430" y2="310"/>
  <rect x="160" y="400" width="180" height="40" rx="6"/>
  <line x1="180" y1="440" x2="180" y2="460"/>
  <line x1="320" y1="440" x2="320" y2="460"/>
</g>
<g class="accent w7">
  <circle cx="240" cy="280" r="50"/>
  <line x1="240" y1="230" x2="240" y2="330"/>
  <line x1="190" y1="280" x2="290" y2="280"/>
</g>
<g class="ink-fill">
  <circle cx="240" cy="280" r="10"/>
</g>
</svg>
