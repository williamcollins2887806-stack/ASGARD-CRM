<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<style>
  .ink          { stroke:var(--icon-ink,#1F2A3A); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .accent       { stroke:var(--icon-accent,#2E7BC0); fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .ink-fill     { fill:var(--icon-ink,#1F2A3A); stroke:none; }
  .accent-fill  { fill:var(--icon-accent,#2E7BC0); stroke:none; }
  .w4  { stroke-width:4;  }
  .w5  { stroke-width:5;  }
  .w6  { stroke-width:6;  }
  .w7  { stroke-width:7;  }
  .w9  { stroke-width:9;  }
  .w10 { stroke-width:10; }
  .w12 { stroke-width:12; }
</style>
<g class="ink w10">
  <rect x="120" y="170" width="270" height="180" rx="16"/>
  <rect x="200" y="120" width="110" height="50" rx="6"/>
  <rect x="160" y="370" width="190" height="30" rx="6"/>
</g>
<g class="accent-fill">
  <rect x="150" y="200" width="210" height="60" rx="6"/>
  <circle cx="170" cy="320" r="10"/>
</g>
<g class="ink w7">
  <line x1="255" y1="120" x2="255" y2="80"/>
</g>
<g class="ink w4">
  <line x1="230" y1="320" x2="370" y2="320"/>
</g>
</svg>
