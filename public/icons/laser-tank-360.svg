  <rect x="180" y="220" width="152" height="220" rx="14"/>
  <circle cx="256" cy="180" r="56"/>
</g>
<g class="accent w5">
  <line x1="256" y1="80" x2="256" y2="160"/>
  <line x1="256" y1="200" x2="256" y2="280"/>
  <line x1="100" y1="180" x2="180" y2="180"/>
  <line x1="332" y1="180" x2="412" y2="180"/>
</g>
<g class="accent-fill">
  <circle cx="256" cy="180" r="10"/>
  <circle cx="100" cy="180" r="6"/>
  <circle cx="412" cy="180" r="6"/>
  <circle cx="256" cy="80" r="6"/>
  <circle cx="256" cy="280" r="6"/>
</g>
</svg>
