  <line x1="170" y1="140" x2="120" y2="100"/>
  <line x1="350" y1="140" x2="400" y2="100"/>
</g>
<g class="ink w7">
  <line x1="220" y1="120" x2="300" y2="120"/>
  <line x1="220" y1="160" x2="300" y2="160"/>
  <line x1="220" y1="200" x2="300" y2="200"/>
  <line x1="220" y1="240" x2="300" y2="240"/>
  <line x1="220" y1="280" x2="300" y2="280"/>
  <line x1="220" y1="320" x2="300" y2="320"/>
  <line x1="220" y1="360" x2="300" y2="360"/>
</g>
<g class="accent w6">
  <line x1="360" y1="200" x2="420" y2="200"/>
  <line x1="420" y1="200" x2="400" y2="180"/>
