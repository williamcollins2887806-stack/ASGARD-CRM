  <rect x="360" y="180" width="70" height="70" rx="10"/>
  <rect x="210" y="280" width="100" height="120" rx="14"/>
  <rect x="180" y="400" width="160" height="52" rx="10"/>
</g>
<g class="accent w7">
  <line x1="380" y1="215" x2="440" y2="215"/>
  <line x1="220" y1="430" x2="300" y2="430"/>
</g>
<g class="ink w4">
