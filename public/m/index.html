<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <!-- D-267: interactive-widget=resizes-content — чтобы на Android клавиатура сжимала
       layout viewport, и нижние кнопки модалок не оставались под клавиатурой.
       На iOS не поддерживается — там работаем через visualViewport.

       viewport-fit=cover обязателен: без него env(safe-area-inset-*) = 0 и
       нижний тап-бар/шапки залезают под чёлку и домашний индикатор. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0c" />
  <!-- Светлая тема: браузерная полоса и фон сплеша должны совпадать с темой приложения.
       Значение обновляет themeStore при переключении темы. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- black-translucent отдаёт весь экран приложению: контент уходит под статус-бар,
       и мы компенсируем это через --safe-top. -->

  <meta name="apple-mobile-web-app-title" content="ASGARD" />
  <meta name="format-detection" content="telephone=no" />
