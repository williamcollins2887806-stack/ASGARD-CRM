<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Асгард CRM — Технические работы</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0f1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#e2e8f0}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{text-align:center;padding:48px 40px;max-width:440px;width:100%;margin:16px}
  .logo{width:88px;height:88px;border-radius:18px;margin:0 auto 28px;display:block;object-fit:contain}
  .spinner{width:56px;height:56px;border:4px solid rgba(99,102,241,.2);border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 32px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:12px;letter-spacing:-.3px}
  p{font-size:15px;color:#94a3b8;line-height:1.6;margin-bottom:8px}
  .countdown{display:inline-block;margin-top:28px;padding:10px 24px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:50px;font-size:14px;color:#818cf8;font-weight:500}
  .hint{margin-top:20px;font-size:12px;color:#475569}
  kbd{background:#1e2535;border:1px solid #334155;border-radius:4px;padding:2px 6px;font-size:11px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/assets/img/logo.png" alt="Асгард Сервис" onerror="this.style.display='none'">
  <div class="spinner"></div>
  <h1>Технические работы</h1>
  <p>Сервер обновляется и скоро снова будет доступен.</p>
  <p>Пожалуйста, подождите — страница перезагрузится автоматически.</p>
  <div class="countdown" id="cd">Повторная проверка через <b id="sec">10</b> сек</div>
  <p class="hint">Или нажмите <kbd>Ctrl+Shift+R</kbd> чтобы обновить вручную</p>
</div>
<script>
(function(){
  var n=10;
  var el=document.getElementById('sec');
  var iv=setInterval(function(){
    n--;
    if(el) el.textContent=n;
    if(n<=0){
      clearInterval(iv);
      location.reload();
    }
  },1000);
})();
</script>
</body>
</html>
