# Drop-in: Asterisk видит тот же PBX_CMD_SECRET, что и asgard-pbx
# (dialplan curl: X-PBX-Secret: ${ENV(PBX_CMD_SECRET)})
#
# Install:
#   mkdir -p /etc/systemd/system/asterisk.service.d
#   cp ops/asterisk/asterisk.service.d/asgard-env.conf /etc/systemd/system/asterisk.service.d/
#   systemctl daemon-reload && systemctl restart asterisk
#
# Без этого drop-in finalize всё равно работает: CMD /recording/finalize
# разрешён с loopback без secret (см. createCmdServer openPaths).

[Service]
EnvironmentFile=-/etc/asgard-crm/pbx.env
