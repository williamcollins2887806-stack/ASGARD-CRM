; ASGARD Ting dial-in (6 digits → LiveKit SIP on 5066)
; Include: #include ting_dialin_extensions.conf
; Test: dial 7888 from internal softphone

[from-ting-dialin]
exten => s,1,NoOp(Ting dial-in from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Read(TINGCODE,beep,6,,,3,8)
 same => n,GotoIf($[${LEN(${TINGCODE})} != 6]?bad)
 same => n,AGI(ting-resolve.py,${TINGCODE})
 same => n,GotoIf($["${TING_OK}" != "1"]?bad)
 same => n,NoOp(Bridge to LiveKit room ${TING_ROOM})
 same => n,Dial(PJSIP/${TING_ROOM}@livekit-ting,120,tT)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()

; Entry points inside this context (Goto from other contexts)
exten => 7888,1,Goto(from-ting-dialin,s,1)
exten => _XXXXXX,1,Goto(from-ting-dialin,s,1)

; Softphone / internal: dial 7888 → IVR for 6-digit code
[internal]
exten => 7888,1,Goto(from-ting-dialin,s,1)

; Optional PSTN DID bridge (when Mango routes a number here)
[from-mango]
exten => 7888,1,Goto(from-ting-dialin,s,1)
