; ASGARD Ting dial-in (6 digits → LiveKit SIP on 5066)
; Include: #include ting_dialin_extensions.conf
; Test: dial 7888 from internal softphone
;
; D18: комнаты с PIN. Сервер отвечает 403 pin_required, диалплан добирает
; 4 цифры DTMF и повторяет AGI.
;
; ВАЖНО: не больше MAX_TRIES попыток PIN, иначе при 429 (PIN_RATE_LIMIT)
; получается бесконечный цикл resolve→askpin до отбоя вызывающего.
;
; D19: CALLERID передаётся в AGI через переменную окружения TING_CALLER,
; чтобы телефонный участник попал в ростер и в протокол.

[from-ting-dialin]
exten => s,1,NoOp(Ting dial-in from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(beep)
 same => n,Read(TINGCODE,beep,6,,,3,8)
 same => n,GotoIf($[${LEN(${TINGCODE})} != 6]?bad)
 same => n,Set(TINGPIN=)
 same => n,Set(TINGTRIES=0)
 same => n(resolve),Set(TING_CALLER=${CALLERID(num)})
 same => n,AGI(ting-resolve.py,${TINGCODE},${TINGPIN})
 same => n,GotoIf($["${TING_OK}" = "1"]?bridge)
 same => n,GotoIf($["${TING_ERR}" = "not_found"]?bad)
 same => n,GotoIf($["${TING_ERR}" = "bad_code"]?bad)
 same => n,GotoIf($["${TING_ERR}" = "api"]?bad)
 same => n,GotoIf($["${TING_ERR}" != "pin_required"]?bad)
 same => n,Set(TINGTRIES=$[${TINGTRIES} + 1])
 same => n,GotoIf($[${TINGTRIES} > 3]?toomany)
 same => n(askpin),NoOp(Ting room requires PIN, attempt ${TINGTRIES})
 same => n,Read(TINGPIN,beep,4,,,3,8)
 same => n,GotoIf($[${LEN(${TINGPIN})} != 4]?bad)
 same => n,Goto(resolve)
 same => n(bridge),NoOp(Bridge to LiveKit room ${TING_ROOM})
 same => n,Dial(PJSIP/${TING_ROOM}@livekit-ting,120,tT)
 same => n,Hangup()
 same => n(toomany),Playback(pbx-invalid)
 same => n,Hangup()
 same => n(bad),Playback(invalid)
 same => n,Hangup()

; Точки входа. Реальные контексты — from-internal / from-mango-inbound
; (см. extensions_asgard.conf), поэтому дублируем алиасы здесь.
exten => 7888,1,Goto(from-ting-dialin,s,1)
exten => _XXXXXX,1,Goto(from-ting-dialin,s,1)

[from-internal]
exten => 7888,1,Goto(from-ting-dialin,s,1)

[from-mango-inbound]
; 6-значный код комнаты: только если это не занятый внутренний номер.
exten => _7[0-9][0-9][0-9],1,Goto(from-ting-dialin,s,1)
