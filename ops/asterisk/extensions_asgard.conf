; ASGARD CRM dialplan snippets
; РўСЂР°РЅРє Mango вЂ” chan_pjsip (PJSIP/mango-trunk).
;
; Р¦РµРїРѕС‡РєР° РІС…РѕРґСЏС‰РµРіРѕ (СЂРµС€РµРЅРёРµ 08.10.2026):
;   1) Р±СЂР°СѓР·РµСЂРЅС‹Рµ РѕРїРµСЂР°С‚РѕСЂС‹ on_line РїРѕ РѕС‡РµСЂРµРґРё (browser_ring_sec=10)
;   2) РґРµР¶СѓСЂРЅС‹Р№ РЅР° РјРѕР±РёР»СЊРЅС‹Р№ (mobile_ring_sec=30)
;   3) РіРѕР»РѕСЃРѕРІР°СЏ РїРѕС‡С‚Р° + РїСѓС€ РїСЂРѕРїСѓС‰РµРЅРЅРѕРіРѕ
; Р—Р°РїРёСЃСЊ (MixMonitor) РІРєР»СЋС‡Р°РµС‚СЃСЏ Р”Рћ AGI вЂ” СЂР°Р·РіРѕРІРѕСЂ РїРёС€РµС‚СЃСЏ РґР°Р¶Рµ РµСЃР»Рё AGI/CRM РЅРµРґРѕСЃС‚СѓРїРЅС‹.


[from-mango-inbound]
; Ting dial-in passthrough (6-digit code) вЂ” РґРѕ _X.
exten => 7888,1,Goto(from-ting-dialin,s,1)
exten => _X.,1,NoOp(Mango inbound ${CALLERID(num)})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,MixMonitor(/var/spool/asterisk/recordings/${ASGARD_MONFILE},b)
 same => n,AGI(agi://127.0.0.1:4573/inbound)
 ; Fail-open: РµСЃР»Рё AGI РЅРµРґРѕСЃС‚СѓРїРµРЅ (CRM/pbx Р»РµР¶РёС‚), РІС‹Р·РѕРІ РЅРµ С‚РµСЂСЏРµРј вЂ” СЃСЂР°Р·Сѓ
 ; Р·РІРѕРЅРёРј РґРµР¶СѓСЂРЅРѕРјСѓ РЅР° РјРѕР±РёР»СЊРЅС‹Р№ Рё, РїСЂРё РЅРµРѕС‚РІРµС‚Рµ, СѓС…РѕРґРёРј РІ РіРѕР»РѕСЃРѕРІСѓСЋ РїРѕС‡С‚Сѓ.
 same => n,GotoIf($["${ASGARD_DIAL_STRING}" = ""]?failopen,1)
 same => n,Goto(asgard-ring,${EXTEN},1)
exten => failopen,1,NoOp(AGI unavailable -> fail-open)
 same => n,GotoIf($["${ASGARD_FAILOPEN_MOBILE}" = ""]?voicemail,s,1)
 same => n,Dial(PJSIP/${ASGARD_FAILOPEN_MOBILE}@mango-trunk,30,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n,Goto(voicemail,s,1)
; Hangup в†’ finalize recording via asgard-pbx CMD (Р»РѕРєР°Р»СЊРЅС‹Р№ РєРѕРЅС‚СѓСЂ)
exten => h,1,NoOp(Asgard finalize ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

[asgard-ring]
exten => _X.,1,NoOp(Ring ${ASGARD_DIAL_STRING} t=${ASGARD_RING_TIMEOUT})
 same => n,Dial(${ASGARD_DIAL_STRING},${ASGARD_RING_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n,GotoIf($["${ASGARD_FALLBACK_DIAL}" = ""]?c3,1)
 same => n,NoOp(Cascade2 ${ASGARD_FALLBACK_DIAL} t=${ASGARD_FALLBACK_TIMEOUT})
 same => n,Dial(${ASGARD_FALLBACK_DIAL},${ASGARD_FALLBACK_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c3),GotoIf($["${ASGARD_CASCADE_3}" = ""]?c4,1)
 same => n,NoOp(Cascade3 ${ASGARD_CASCADE_3} t=${ASGARD_CASCADE_3_TO})
 same => n,Dial(${ASGARD_CASCADE_3},${ASGARD_CASCADE_3_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c4),GotoIf($["${ASGARD_CASCADE_4}" = ""]?c5,1)
 same => n,NoOp(Cascade4 ${ASGARD_CASCADE_4} t=${ASGARD_CASCADE_4_TO})
 same => n,Dial(${ASGARD_CASCADE_4},${ASGARD_CASCADE_4_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c5),GotoIf($["${ASGARD_CASCADE_5}" = ""]?c6,1)
 same => n,NoOp(Cascade5 ${ASGARD_CASCADE_5} t=${ASGARD_CASCADE_5_TO})
 same => n,Dial(${ASGARD_CASCADE_5},${ASGARD_CASCADE_5_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c6),GotoIf($["${ASGARD_DUTY_MOBILE}" = ""]?voicemail,s,1)
 same => n,NoOp(Duty mobile ${ASGARD_DUTY_MOBILE} t=${ASGARD_DUTY_MOBILE_TO})
 same => n,Dial(PJSIP/${ASGARD_DUTY_MOBILE}@mango-trunk,${ASGARD_DUTY_MOBILE_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n,Goto(voicemail,s,1)
exten => hang,1,NoOp(Answered ${DIALSTATUS})
 same => n,Hangup()
exten => h,1,NoOp(Asgard ring hangup ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

; Р“РѕР»РѕСЃРѕРІР°СЏ РїРѕС‡С‚Р°: СЃРІРѕР№ Record() (Р±РµР· Comedian Mail) в†’ WAV РІ spool, Р·Р°С‚РµРј finalize+hook.
[asgard-voicemail]
exten => s,1,NoOp(Voicemail for ${ASGARD_PBX_UID} from ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(custom/voicemail-prompt)
 same => n,Set(ASGARD_VM_FILE=voicemail/${ASGARD_PBX_UID})
 same => n,Record(${ASGARD_VM_FILE}.wav,${ASGARD_VM_MAX_SEC:-60},${ASGARD_VM_SILENCE:-3},k)
 same => n,Playback(custom/voicemail-thanks)
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/voicemail -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"file\":\"/var/spool/asterisk/${ASGARD_VM_FILE}.wav\"}")
 same => n,Hangup()

; Mobile: dial via trunk with confirm subroutine (chan_pjsip)
[asgard-mobile-confirm]
exten => _X.,1,NoOp(Mobile confirm ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@mango-trunk,25,gU(confirm-press-1^s^1))
 same => n,Hangup()

[confirm-press-1]
exten => s,1,Answer()
 same => n,Playback(beep)
 same => n,Read(DTMF_CONFIRM,custom/confirm-press-1,1,,1,5)
 same => n,GotoIf($["${DTMF_CONFIRM}" = "1"]?confirmed,1:timeout,1)
exten => confirmed,1,NoOp(Operator confirmed)
 same => n,Return()
exten => timeout,1,Hangup()

; Blind: Dial resolved webrtc/GSM; on fail return to initiator (TRANSFER_RETURN_DIAL)
[transfer]
exten => blind,1,NoOp(Blind transfer dial=${TRANSFER_DIAL} target=${TRANSFER_TARGET})
 same => n,Set(TRANSFER_STATUS=trying)
 same => n,GotoIf($["${TRANSFER_DIAL}" = ""]?legacy,1)
 same => n,Dial(${TRANSFER_DIAL},${TRANSFER_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n,GotoIf($["${TRANSFER_FALLBACK}" = ""]?ret,1)
 same => n,Dial(${TRANSFER_FALLBACK},${TRANSFER_FALLBACK_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n(ret),Set(TRANSFER_STATUS=noanswer)
 same => n,GotoIf($["${TRANSFER_RETURN_DIAL}" = ""]?fail,1)
 same => n,NoOp(Transfer return to initiator)
 same => n,Dial(${TRANSFER_RETURN_DIAL},${TRANSFER_RETURN_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?returned,1)
 same => n,Goto(fail,1)
exten => legacy,1,Dial(PJSIP/${TRANSFER_TARGET},30,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n,Goto(fail,1)
exten => ok,1,Set(TRANSFER_STATUS=answered)
 same => n,Hangup()
exten => returned,1,Set(TRANSFER_STATUS=returned)
 same => n,Hangup()
exten => fail,1,Set(TRANSFER_STATUS=failed)
 same => n,Hangup()
exten => consult,1,NoOp(Consult transfer)
 same => n,GotoIf($["${TRANSFER_DIAL}" != ""]?cdial,1)
 same => n,Dial(PJSIP/${CONSULT_TARGET},30)
 same => n,Return()
 same => n(cdial),Dial(${TRANSFER_DIAL},${TRANSFER_TIMEOUT},g)
 same => n,Return()

[hold]
exten => s,1,MusicOnHold(default)
 same => n,Return()

; РСЃС…РѕРґСЏС‰РёРµ CRM: Р·Р°РїРёСЃСЊ Р’РЎР•Р“Р”Рђ (РїРѕ СЂРµС€РµРЅРёСЋ), Р·Р°С‚РµРј Dial С‡РµСЂРµР· С‚СЂР°РЅРє.
[outbound-crm]
exten => _X.,1,NoOp(CRM outbound ${EXTEN})
 same => n,Set(CALLERID(num)=${IF($["${OUTBOUND_CLI}" != ""]?${OUTBOUND_CLI}:${CALLERID(num)})})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,MixMonitor(/var/spool/asterisk/recordings/${ASGARD_MONFILE},b)
 same => n,Dial(PJSIP/${EXTEN}@mango-trunk,60,tT)
 same => n,Hangup()
exten => h,1,NoOp(Asgard outbound finalize ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

; РљРѕРЅС‚РµРєСЃС‚ WebRTC-РѕРїРµСЂР°С‚РѕСЂРѕРІ: РёСЃС…РѕРґСЏС‰РёРµ С‡РµСЂРµР· Mango (СЃ Р·Р°РїРёСЃСЊСЋ) + РІРЅСѓС‚СЂРµРЅРЅРёРµ XXX.
[from-internal]
; Исходящие из браузера (WebRTC-оператор). ASGARD_OP_USER — внутренний логин
; вызывающего (u<user_id>), из него CRM берёт user_id: иначе звонок не привязан
; к оператору и не виден ему в журнале (инцидент 09.10.2026).
exten => _+7XXXXXXXXXX,1,Set(CALLERID(num)=${IF($["${OUTBOUND_CLI}" != ""]?${OUTBOUND_CLI}:${CALLERID(num)})})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,Set(ASGARD_OP_USER=${CHANNEL(endpoint)})
 same => n,Set(ASGARD_OUT_NUMBER=${EXTEN:1})
 same => n,MixMonitor(/var/spool/asterisk/recordings/${ASGARD_MONFILE},b)
 same => n,Dial(PJSIP/${EXTEN:1}@mango-trunk,60,tT)
 same => n,Hangup()
exten => _8XXXXXXXXXX,1,Set(CALLERID(num)=${IF($["${OUTBOUND_CLI}" != ""]?${OUTBOUND_CLI}:${CALLERID(num)})})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,Set(ASGARD_OP_USER=${CHANNEL(endpoint)})
 same => n,Set(ASGARD_OUT_NUMBER=7${EXTEN:1})
 same => n,MixMonitor(/var/spool/asterisk/recordings/${ASGARD_MONFILE},b)
 same => n,Dial(PJSIP/7${EXTEN:1}@mango-trunk,60,tT)
 same => n,Hangup()
exten => _7XXXXXXXXXX,1,Set(CALLERID(num)=${IF($["${OUTBOUND_CLI}" != ""]?${OUTBOUND_CLI}:${CALLERID(num)})})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,Set(ASGARD_OP_USER=${CHANNEL(endpoint)})
 same => n,Set(ASGARD_OUT_NUMBER=${EXTEN})
 same => n,MixMonitor(/var/spool/asterisk/recordings/${ASGARD_MONFILE},b)
 same => n,Dial(PJSIP/${EXTEN}@mango-trunk,60,tT)
 same => n,Hangup()
exten => _XXX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
exten => h,1,NoOp(Asgard internal finalize ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\",\"operator\":\"${ASGARD_OP_USER}\",\"number\":\"${ASGARD_OUT_NUMBER}\",\"direction\":\"outbound\",\"callType\":\"outbound\"}")

[noagents]
exten => s,1,Playback(beep)
 same => n,Hangup()

[noanswer]
exten => s,1,Goto(voicemail,s,1)

[voicemail]
exten => s,1,Goto(asgard-voicemail,s,1)
