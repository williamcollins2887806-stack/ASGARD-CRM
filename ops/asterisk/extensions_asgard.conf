; ASGARD CRM dialplan snippets

[from-mango-inbound]
exten => _X.,1,NoOp(Mango inbound ${CALLERID(num)})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,MixMonitor(${ASGARD_MONFILE},b)
 same => n,AGI(agi://127.0.0.1:4573/inbound)
 same => n,GotoIf($["${ASGARD_DIAL_STRING}" = ""]?noagents,1)
 same => n,Goto(asgard-ring,${EXTEN},1)
; Hangup → finalize recording via asgard-pbx CMD (локальный контур)
exten => h,1,NoOp(Asgard finalize ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

[asgard-ring]
exten => _X.,1,NoOp(Ring ${ASGARD_DIAL_STRING} t=${ASGARD_RING_TIMEOUT})
 same => n,Dial(${ASGARD_DIAL_STRING},${ASGARD_RING_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n,GotoIf($["${ASGARD_FALLBACK_DIAL}" = ""]?c3,1)
 same => n,NoOp(Cascade2 ${ASGARD_FALLBACK_DIAL} t=${ASGARD_FALLBACK_TIMEOUT})
 same => n,Dial(${ASGARD_FALLBACK_DIAL},${ASGARD_FALLBACK_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c3),GotoIf($["${ASGARD_CASCADE_3}" = ""]?c4,1)
 same => n,NoOp(Cascade3 ${ASGARD_CASCADE_3} t=${ASGARD_CASCADE_3_TO})
 same => n,Dial(${ASGARD_CASCADE_3},${ASGARD_CASCADE_3_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c4),GotoIf($["${ASGARD_CASCADE_4}" = ""]?c5,1)
 same => n,NoOp(Cascade4 ${ASGARD_CASCADE_4} t=${ASGARD_CASCADE_4_TO})
 same => n,Dial(${ASGARD_CASCADE_4},${ASGARD_CASCADE_4_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n(c5),GotoIf($["${ASGARD_CASCADE_5}" = ""]?noanswer,1)
 same => n,NoOp(Cascade5 ${ASGARD_CASCADE_5} t=${ASGARD_CASCADE_5_TO})
 same => n,Dial(${ASGARD_CASCADE_5},${ASGARD_CASCADE_5_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?hang,1)
 same => n,Goto(noanswer,1)
exten => hang,1,NoOp(Answered ${DIALSTATUS})
 same => n,Hangup()
exten => h,1,NoOp(Asgard ring hangup ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

; Mobile: dial via trunk with confirm subroutine
[asgard-mobile-confirm]
exten => _X.,1,NoOp(Mobile confirm ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@mango-trunk,25,gU(confirm-press-1^s^1))
 same => n,Hangup()

[confirm-press-1]
exten => s,1,Answer()
 same => n,Playback(beep)
 same => n,Read(DTMF_CONFIRM,custom/confirm-press-1,1,,1,5)
 same => n,GotoIf($["${DTMF_CONFIRM}" = "1"]?confirmed,1:timeout,1)
exten => confirmed,1,NoOp(Operator confirmed)
 same => n,Return()
exten => timeout,1,Hangup()

; Blind: Dial resolved webrtc/GSM; on fail return to initiator (TRANSFER_RETURN_DIAL)
[transfer]
exten => blind,1,NoOp(Blind transfer dial=${TRANSFER_DIAL} target=${TRANSFER_TARGET})
 same => n,Set(TRANSFER_STATUS=trying)
 same => n,GotoIf($["${TRANSFER_DIAL}" = ""]?legacy,1)
 same => n,Dial(${TRANSFER_DIAL},${TRANSFER_TIMEOUT},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n,GotoIf($["${TRANSFER_FALLBACK}" = ""]?ret,1)
 same => n,Dial(${TRANSFER_FALLBACK},${TRANSFER_FALLBACK_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n(ret),Set(TRANSFER_STATUS=noanswer)
 same => n,GotoIf($["${TRANSFER_RETURN_DIAL}" = ""]?fail,1)
 same => n,NoOp(Transfer return to initiator)
 same => n,Dial(${TRANSFER_RETURN_DIAL},${TRANSFER_RETURN_TO},g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?returned,1)
 same => n,Goto(fail,1)
exten => legacy,1,Dial(PJSIP/${TRANSFER_TARGET},30,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?ok,1)
 same => n,Goto(fail,1)
exten => ok,1,Set(TRANSFER_STATUS=answered)
 same => n,Hangup()
exten => returned,1,Set(TRANSFER_STATUS=returned)
 same => n,Hangup()
exten => fail,1,Set(TRANSFER_STATUS=failed)
 same => n,Hangup()
exten => consult,1,NoOp(Consult transfer)
 same => n,GotoIf($["${TRANSFER_DIAL}" != ""]?cdial,1)
 same => n,Dial(PJSIP/${CONSULT_TARGET},30)
 same => n,Return()
 same => n(cdial),Dial(${TRANSFER_DIAL},${TRANSFER_TIMEOUT},g)
 same => n,Return()

[hold]
exten => s,1,MusicOnHold(default)
 same => n,Return()

[outbound-crm]
exten => _X.,1,NoOp(CRM outbound ${EXTEN})
 same => n,Dial(PJSIP/mango-trunk/${EXTEN},60)
 same => n,Hangup()

[noagents]
exten => s,1,Playback(beep)
 same => n,Hangup()

[noanswer]
exten => s,1,Hangup()
