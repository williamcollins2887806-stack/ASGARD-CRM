; ASGARD CRM dialplan snippets

[from-mango-inbound]
exten => _X.,1,NoOp(Mango inbound ${CALLERID(num)})
 same => n,Set(ASGARD_PBX_UID=${UNIQUEID})
 same => n,Set(ASGARD_MONFILE=${STRFTIME(${EPOCH},,%Y/%m/)}${UNIQUEID}.wav)
 same => n,MixMonitor(${ASGARD_MONFILE},b)
 same => n,AGI(agi://127.0.0.1:4573/inbound)
 same => n,GotoIf($["${ASGARD_DIAL_STRING}" = ""]?noagents,1)
 same => n,Goto(asgard-ring,${EXTEN},1)
; Hangup → finalize recording via asgard-pbx CMD (локальный контур)
exten => h,1,NoOp(Asgard finalize ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

[asgard-ring]
exten => _X.,1,NoOp(Ring ${ASGARD_DIAL_STRING} t=${ASGARD_RING_TIMEOUT})
 same => n,Dial(${ASGARD_DIAL_STRING},${ASGARD_RING_TIMEOUT},g)
 same => n,Goto(noanswer,1)
exten => h,1,NoOp(Asgard ring hangup ${ASGARD_PBX_UID})
 same => n,System(curl -sm 8 -X POST http://127.0.0.1:4575/recording/finalize -H "Content-Type: application/json" -H "X-PBX-Secret: ${ENV(PBX_CMD_SECRET)}" -d "{\"pbxUid\":\"${ASGARD_PBX_UID}\",\"callId\":\"pbx_${ASGARD_PBX_UID}\",\"monFile\":\"${ASGARD_MONFILE}\"}")

; Mobile: dial via trunk with confirm subroutine
[asgard-mobile-confirm]
exten => _X.,1,NoOp(Mobile confirm ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@mango-trunk,25,gU(confirm-press-1^s^1))
 same => n,Hangup()

[confirm-press-1]
exten => s,1,Answer()
 same => n,Playback(beep)
 same => n,Read(DTMF_CONFIRM,custom/confirm-press-1,1,,1,5)
 same => n,GotoIf($["${DTMF_CONFIRM}" = "1"]?confirmed,1:timeout,1)
exten => confirmed,1,NoOp(Operator confirmed)
 same => n,Return()
exten => timeout,1,Hangup()

[transfer]
exten => blind,1,NoOp(Blind transfer ${TRANSFER_TARGET})
 same => n,Dial(PJSIP/${TRANSFER_TARGET},30)
 same => n,Hangup()
exten => consult,1,NoOp(Consult transfer)
 same => n,Dial(PJSIP/${CONSULT_TARGET},30)
 same => n,Return()

[hold]
exten => s,1,MusicOnHold(default)
 same => n,Return()

[outbound-crm]
exten => _X.,1,NoOp(CRM outbound ${EXTEN})
 same => n,Dial(PJSIP/mango-trunk/${EXTEN},60)
 same => n,Hangup()

[noagents]
exten => s,1,Playback(beep)
 same => n,Hangup()

[noanswer]
exten => s,1,Hangup()
