; ASGARD CRM — PJSIP транки (chan_pjsip). Include from pjsip.conf AFTER transport-ws.
; Миграция с chan_sip: mango-trunk (Mango VPBX) и livekit-ting (Тинг).
;
; ВНИМАНИЕ: transport-udp биндится на 0.0.0.0:5060. Пока активен chan_sip на :5060,
; этот include НЕ подключать (порт занят). Порядок миграции:
;   1) chan_sip noload (или sip.conf без бинда), 2) restart, 3) include этого файла.

; ── UDP транспорт для внешних транков ──
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
external_media_address=92.242.61.184
external_signaling_address=92.242.61.184

; ── Mango VPBX (входящие/исходящие), IP-авторизация без register ──
[mango-trunk]
type=endpoint
transport=transport-udp
context=from-mango-inbound
disallow=all
allow=g722,alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
from_domain=vpbx400020795.mangosip.ru
from_user=92.242.61.184
; IP-based auth: не требуем регистрацию/пароль (аналог insecure=port,invite)
aors=mango-trunk

[mango-trunk]
type=aor
contact=sip:81.88.86.55:5060
qualify_frequency=60

[identify-mango]
type=identify
endpoint=mango-trunk
match=81.88.86.55/32

; ── LiveKit SIP (Тинг), локальный ──
[livekit-ting]
type=endpoint
transport=transport-udp
context=from-livekit
disallow=all
allow=ulaw,alaw
direct_media=no
dtmf_mode=rfc4733
from_domain=127.0.0.1
aors=livekit-ting

[livekit-ting]
type=aor
contact=sip:127.0.0.1:5066
qualify_frequency=60

[identify-livekit]
type=identify
endpoint=livekit-ting
; ВАЖНО: match=127.0.0.1/32 конфликтует с WebRTC-операторами — браузеры приходят
; через nginx (127.0.0.1:8088) и при порядке идентификации ip,username тоже
; опознавались как livekit-ting → REGISTER отвечал 404 (инцидент 09.10.2026).
; Лечится глобальным endpoint_identifier_order=username,ip,anonymous в pjsip.conf
; (см. ops/asterisk/pjsip.global.snippet). Не удалять: match нужен самому Ting.
match=127.0.0.1/32
