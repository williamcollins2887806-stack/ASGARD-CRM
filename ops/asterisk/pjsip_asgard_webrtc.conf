; ASGARD CRM — WebRTC endpoints (PJSIP). Include from pjsip.conf.
; TLS терминируется nginx (wss://asgard-crm.ru/pbx/ws → http://127.0.0.1:8088/ws),
; поэтому транспорт Asterisk — plain ws на loopback (наружу не выставлен).

[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1:8088
; ВАЖНО (инцидент 09–10.10.2026: «звонок доходит, но ни я ни меня не слышат»).
;
; Сервер за one-to-one NAT: публичный 92.242.61.184 НЕ на интерфейсе, реальный
; адрес — 192.168.0.135 (ens3). Поэтому нужен external_media_address, иначе в
; SDP уйдёт приватный адрес и браузер не достучится.
;
; ⚠️ local_net намеренно НЕ указан для 172.16.0.0/12.
; Операторы подключаются из корпоративной VPN-сети 172.16.219.x. Если объявить
; её «локальной», Asterisk считает адрес браузера достижимым напрямую, НЕ
; подставляет external_media_address и в SDP остаётся приватный 192.168.0.135 —
; медиа уходит в никуда, в трубке тишина (замер SDP: c=IN IP4 192.168.0.135 при
; браузере из 172.16.219.2). Оставляем local_net только для реальных локальных
; сетей сервера, куда внешний адрес подставлять не нужно.
local_net=10.0.0.0/8
local_net=192.168.0.0/16
external_media_address=92.242.61.184
external_signaling_address=92.242.61.184

[webrtc-template](!)
type=endpoint
context=from-internal
disallow=all
; ВАЖНО: только кодеки, которые есть в сборке Asterisk И на транке Mango.
; codec_opus.so отсутствует (сборка без opus-транскодера), и без него
; «opus → ulaw» не имеет пути трансляции: при ответе Asterisk не может свести
; плечо WebRTC с транком и рвёт звонок сразу после ответа (инцидент 09.10.2026:
; «он ответил и звонок сразу сбросился»). Транк разрешает g722,alaw,ulaw —
; держим тот же набор. Opus вернуть можно ТОЛЬКО вместе с модулем codec_opus.
allow=g722,ulaw,alaw
; webrtc=yes — как было вчера, когда звонки соединялись БЫСТРО.
; Он включает ICE (ice_support), rtcp_mux, use_avpf, use_received_transport,
; media_encryption=dtls, dtls_setup=actpass — всё, что нужно WebRTC.
;
; ⚠️ ИСТОРИЯ (чтобы не сломать снова):
; 10.10.2026 я убрал webrtc=yes и поставил ice_support=no — и звонки стали
; идти ~30 секунд и рваться с 488 Not Acceptable Here. Причина: с
; ice_support=no Asterisk игнорирует ICE-кандидатов браузера и идёт по c=/m=
; из SDP напрямую; если путь не совпал, лечение — только таймаут.
; НЕ убирать webrtc=yes. Настоящая причина отсутствия звука была ДРУГОЙ —
; отсутствовал DTLS-сертификат (каталог /var/lib/asterisk/keys не существовал),
; поэтому dtls-handshake не стартовал и браузер отвечал 488. Это лечится
; созданием каталога и ключей, а не отключением ICE.
webrtc=yes
; Явный сертификат для DTLS: без него WebRTC-медиа невозможно.
; dtls_auto_generate_cert НЕ включаем — Asterisk запрещает одновременно
; auto_generate и явный cert_file (ошибка rtp_engine.c).
dtls_auto_generate_cert=no
dtls_cert_file=/var/lib/asterisk/keys/asterisk.crt
dtls_private_key=/var/lib/asterisk/keys/asterisk.key
; Публичный адрес для SDP: сервер за one-to-one NAT, своего адреса на
; интерфейсе нет. Без этого Asterisk пишет приватный 192.168.0.135.
media_address=92.242.61.184
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
transport=transport-ws

[auth-webrtc-template](!)
type=auth
auth_type=userpass

[aor-webrtc-template](!)
type=aor
max_contacts=3
remove_existing=no

; Конкретные операторы — в pjsip_operators.conf (автогенерация
; tools/provision_pjsip_operators.js из pbx_operators).
