# Drop-in для asgard-crm.service — пост-рестарт smoke.
# Установка:
#   mkdir -p /etc/systemd/system/asgard-crm.service.d/
#   cp ops/asgard-crm-smoke.systemd-dropin.conf /etc/systemd/system/asgard-crm.service.d/smoke.conf
#   systemctl daemon-reload
#
# Fork+detach через nohup — НЕ блокирует start, не зависит от dbus/systemd-run.
# systemd-run требовал interactive auth и валил start.
[Service]
ExecStartPost=/bin/sh -c '/usr/bin/nohup /usr/local/bin/asgard-post-restart-smoke.sh </dev/null >/tmp/asgard-smoke.log 2>&1 &'
