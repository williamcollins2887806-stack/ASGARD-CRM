# ASGARD Тинг — LiveKit stack
# UDP: Asterisk RTP 10000-20000; coturn relay 30000-39900;
# LiveKit SIP RTP 40000+; LiveKit RTC 50000-60000
# coturn listening: UDP 3478

services:
  livekit-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    depends_on:
      - livekit-redis
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # host networking: нужен для relay UDP 40000-49900 без проброса тысяч портов
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # альтернатива без host: ports "3478:3478/udp" + "40000-49900:40000-49900/udp"
    command: ["-c", "/etc/coturn/turnserver.conf"]

  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - /var/lib/asgard-thing/recordings:/var/lib/asgard-thing/recordings

  livekit-sip:
    image: livekit/sip:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - livekit
      - livekit-redis
    volumes:
      - ./sip.yaml:/etc/sip.yaml:ro
    command: ["--config", "/etc/sip.yaml"]
