# LiveKit config for ASGARD Тинг
# UDP RTC MUST NOT overlap Asterisk 10000-20000

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

redis:
  address: 127.0.0.1:6379
  db: 2

# keys: заменить на прод-секреты из /etc/asgard-crm/thing.env
keys:
  APItingdevkey: ting_dev_secret_change_me

logging:
  level: info

room:
  empty_timeout: 300
  max_participants: 50

# Huginn 1:1 call hygiene (optional but recommended).
# LiveKit posts room lifecycle events here; the CRM closes the call row so a
# crashed client never leaves the user "busy". Requires LIVEKIT_WEBHOOK_SECRET
# in the app env AND the same value as api_key here.
# webhook:
#   api_key: <LIVEKIT_API_KEY>
#   urls:
#     - https://asgard-crm.ru/api/chat-groups/calls/webhook
