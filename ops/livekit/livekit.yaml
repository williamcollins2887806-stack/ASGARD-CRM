# LiveKit config for ASGARD Тинг
# UDP RTC MUST NOT overlap Asterisk 10000-20000

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

redis:
  address: 127.0.0.1:6379
  db: 2

# keys: заменить на прод-секреты из /etc/asgard-crm/thing.env
keys:
  APItingdevkey: ting_dev_secret_change_me

logging:
  level: info

room:
  empty_timeout: 300
  max_participants: 50

# Huginn 1:1 call hygiene — ENABLED on prod (applied to
# /opt/asgard-livekit/livekit.yaml on 2026-10-07, verified: LiveKit logs
# "sent webhook" for room_started/room_finished with 200 OK).
#
# `api_key` must be one of the keys above (the app verifies the signature with
# LIVEKIT_API_KEY + LIVEKIT_WEBHOOK_SECRET || LIVEKIT_API_SECRET).
# The path is public and signature-only: no secret -> 503, wrong content-type
# -> 415, bad signature -> 401.
webhook:
  api_key: APItingdevkey
  urls:
    - https://asgard-crm.ru/api/chat-groups/calls/webhook
