# LiveKit Egress — ASGARD Тинг
#
# СХЕМА ВАЖНА: egress парсит YAML нестрого и МОЛЧА игнорирует неизвестные ключи.
# Если положить s3/backup не туда, запись тихо уйдёт на локальный диск — ровно D22.
#
# Правильная структура:
#   storage: { s3: <provider> }     — куда складывать (provider внутри storage)
#   backup:  <StorageConfig>        — только prefix + провайдеры (нет enabled/upload_at_end)
#   cpu_cost: { ..., max_cpu_utilization }  — порог CPU ВНУТРИ cpu_cost
#
# Секреты — из /etc/asgard-crm/thing.env (envsubst), не в git (D20).

api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}
ws_url: ws://127.0.0.1:7880
redis:
  # тот же порт, что публикует docker-compose (6382), и та же db
  address: 127.0.0.1:6382
  db: 2

# Прод: TLS обязателен. Здесь ws:// к localhost — по документации egress для
# локального соединения нужен insecure: true, иначе RoomComposite не поднимется.
insecure: true

log_level: info

cpu_cost:
  room_composite_cpu_cost: 4.0
  track_composite_cpu_cost: 2.0
  track_cpu_cost: 0.5
  web_cpu_cost: 2.0
  # Порог ВНУТРИ cpu_cost: при cpus=6 бюджет 4.8 → одна RoomComposite гарантирована.
  max_cpu_utilization: 0.8

# S3/MinIO: запись не должна зависеть от локального диска.
# Провайдер лежит ВНУТРИ storage.s3 — иначе egress молча пишет на диск.
storage:
  s3:
    access_key: ${S3_ACCESS_KEY}
    secret: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    force_path_style: true

# Жёсткий лимит длительности: без него egress обрывается сам на 1 часе
# со статусом EGRESS_LIMIT_REACHED и запись теряется молча.
session_limits:
  file_output_max_duration: 4h

# Backup — это StorageConfig (prefix + провайдер), без enabled/upload_at_end.
# Дублируем в тот же бакет с префиксом backup/: потеря одной ноды не убивает запись.
backup: backup/
