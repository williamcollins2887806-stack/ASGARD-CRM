# coturn for ASGARD Тинг (LiveKit external TURN)
#
# Relay UDP 30000-39900 — НЕ пересекает Asterisk 10000-20000,
# LiveKit SIP RTP 40000+ и LiveKit RTC 50000-60000.
#
# ВАЖНО (Q03, D23): корпоративные сети часто режут весь UDP, кроме 443.
# Без TURN/TLS гости из таких сетей не подключатся вообще. Поэтому TLS включён,
# а диапазон релея должен открываться в ДВУХ фаерволах (провайдер + хост).

listening-port=3478
tls-listening-port=5349
alt-tls-listening-port=443

fingerprint
lt-cred-mech
use-auth-secret
# На проде: тот же секрет, что TURN_SECRET в /etc/asgard-crm/thing.env
# и rtc.turn_servers[].secret в livekit.yaml. В git только placeholder.
static-auth-secret=${TURN_SECRET}
realm=asgard-crm.ru

# На проде: external-ip=92.242.61.184
# При NAT пара PUBLIC/PRIVATE обязательна, иначе XOR-RELAYED-ADDRESS врёт.
external-ip=${TURN_EXTERNAL_IP}

min-port=30000
max-port=39900

# TLS: сертификат для asgard-crm.ru. Порт 443 требует свободного IP/SNI,
# иначе конфликт с nginx — см. ops/livekit/README.md (раздел «TURN/TLS»).
cert=/etc/letsencrypt/live/asgard-crm.ru/fullchain.pem
pkey=/etc/letsencrypt/live/asgard-crm.ru/privkey.pem
# DTLS для WebRTC обязателен, если клиент идёт по UDP/TLS.
# dh-file вместо директив dh2066/no-loopback-peers: в coturn 4.6.3 их нет,
# конфиг с ними даёт «Bad configuration format» и шум в логе.
dh-file=/etc/ssl/certs/dhparam.pem

# Только TURN, без CLI-доступа
no-cli
no-multicast-peers

# Логи и квоты
log-file=stdout
simple-log
total-quota=1200
bps-capacity=0
stale-nonce

# Запрет релея на приватные адреса (SSRF-защита)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=${TURN_EXTERNAL_IP}
