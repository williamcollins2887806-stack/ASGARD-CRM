# coturn for ASGARD Тинг (LiveKit external TURN)
# Relay UDP 30000-39900 — НЕ пересекает Asterisk 10000-20000,
# LiveKit SIP RTP 40000+ и LiveKit RTC 50000-60000

listening-port=3478
fingerprint
lt-cred-mech
use-auth-secret
# На проде: тот же секрет, что TURN_SECRET в /etc/asgard-crm/thing.env
# и rtc.turn_servers[].secret в livekit.yaml
static-auth-secret=CHANGE_ME_TURN_SECRET
realm=asgard-crm.ru

# На проде: external-ip=92.242.61.184
external-ip=92.242.61.184

min-port=30000
max-port=39900

# только UDP TURN (TLS/443 — отдельно при необходимости)
no-tls
no-dtls
no-cli
